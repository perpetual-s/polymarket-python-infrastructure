[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q -ra --tb=short --asyncio-mode=auto
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    benchmark: performance and throughput tests
    integration: tests that require an external service or live connection
    testnet: tests that require explicit testnet credentials and access
filterwarnings =
    ignore::DeprecationWarning:websockets.legacy.*
